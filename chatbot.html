<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>NagarSathi AI</title>

<link rel="stylesheet"
href="css/chatbot.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<div class="chat-container">

<div class="chat-sidebar">

<h2>Nagar<span>Sathi</span></h2>

<button>

<i class="fa-solid fa-plus"></i>

नई चैट

</button>


<div class="history">

<div class="item active">

Water Query

</div>

<div class="item">

Road Complaint

</div>

<div class="item">

Garbage Timing

</div>

</div>

</div>




<div class="chat-main">

<div class="chat-header">

<div>

<h3>नागर AI सहायक</h3>

<p>24×7 नागरिक सहायता</p>

</div>

</div>



<div class="chat-messages">

<div class="bot">

नमस्ते 👋 मैं NagarSathi AI हूँ।

</div>


<div class="user">

Ward 3 में पानी कब आएगा?

</div>


<div class="bot">

आज शाम 6 बजे पानी आपूर्ति होगी।

</div>

</div>




<div class="chat-input">

<input
id="userInput"
type="text"
placeholder="प्रश्न पूछें...">

<button id="micBtn">

<i class="fa-solid fa-microphone"></i>

</button>

<button id="imageBtn">

<i class="fa-solid fa-image"></i>

</button>

<input
id="imageUpload"
type="file"
hidden>

<button id="sendBtn">

<i class="fa-solid fa-paper-plane"></i>

</button>

</div>

</div>

</div>
<script src="js/database.js"></script>

<script src="js/search.js"></script>

<script src="js/chatbot.js"></script>

<script src="js/voice.js"></script>

<script src="js/imageAI.js"></script>
<script src="js/database.js"></script>

<script src="js/chatbot.js"></script>
</body>

</html>
